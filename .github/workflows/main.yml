
name: Build COSMOS X IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project CosmosX.xcodeproj -scheme CosmosX -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/CosmosX.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/CosmosX.app
          cd build/ipa
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/COSMOS-X-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: COSMOS-X-unsigned-IPA
          path: COSMOS-X-unsigned.ipa
          retention-days: 7

      - name: Publish IPA to ipa-build branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp COSMOS-X-unsigned.ipa "$RUNNER_TEMP/COSMOS-X-unsigned.ipa"
          git checkout --orphan ipa-build
          git rm -rf . > /dev/null
          cp "$RUNNER_TEMP/COSMOS-X-unsigned.ipa" .
          git add COSMOS-X-unsigned.ipa
          git commit -m "Add built IPA"
          git push --force origin ipa-build
